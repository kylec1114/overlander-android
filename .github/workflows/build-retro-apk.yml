name: Build Retro HTML APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['retro-apk/**', '.github/workflows/build-retro-apk.yml']
permissions:
  contents: read
concurrency:
  group: retro-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check UI source
        id: source
        run: |
          if [ -f retro-apk/ui-source.lzma.b64 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'UI source has not been committed yet. APK build skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Expand UI and validate source
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, re, subprocess, tempfile, xml.etree.ElementTree as ET
          raw = base64.b64decode(Path('retro-apk/ui-source.lzma.b64').read_text(), validate=True)
          html = lzma.decompress(raw).decode('utf-8')
          assert html.rstrip().endswith('</html>'), 'Incomplete HTML'
          assert not re.search(r'<script[^>]+src=', html, re.I), 'Remote scripts are not allowed'
          for js in re.findall(r'<script>(.*?)</script>', html, re.S):
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as f:
                  f.write(js)
                  f.flush()
                  subprocess.run(['node', '--check', f.name], check=True)
          target = Path('retro-apk/app/src/main/assets/index.html')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(html, encoding='utf-8')
          for p in Path('retro-apk/app/src/main').rglob('*.xml'):
              ET.parse(p)
          PY
      - uses: actions/setup-java@v4
        if: steps.source.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.source.outputs.ready == 'true'
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.source.outputs.ready == 'true'
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        if: steps.source.outputs.ready == 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        if: steps.source.outputs.ready == 'true'
        run: gradle -p retro-apk :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and signature
        if: steps.source.outputs.ready == 'true'
        run: |
          APK=retro-apk/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" overlander-retro-v0.4.1-debug.apk
      - name: Upload APK
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: overlander-retro-v0.4.1-debug-apk
          path: overlander-retro-v0.4.1-debug.apk
          if-no-files-found: error
          retention-days: 14
